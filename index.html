<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Turístico Amazing</title>
    
    <!-- Favicon del Logo Oficial -->
    <link rel="icon" href="Png_Logo%20Vertical%20Texto%20Negro.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para compilar JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f1f5f9; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .animate-spin-slow { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-teal-200 selection:text-teal-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ path, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: path }} />
        );
        const RefreshCw = (p) => <Icon {...p} path='<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>' />;
        const MapPin = (p) => <Icon {...p} path='<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>' />;
        const Instagram = (p) => <Icon {...p} path='<rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>' />;
        const Facebook = (p) => <Icon {...p} path='<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>' />;
        const TikTok = (p) => <Icon {...p} path='<path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5v3a3 3 0 0 1-3-3v11a7 7 0 1 1-7-7v3a4 4 0 0 0 4 4z"/>' />;
        const Twitter = (p) => <Icon {...p} path='<path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>' />;
        const TrendingUp = (p) => <Icon {...p} path='<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>' />;
        const Clock = (p) => <Icon {...p} path='<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' />;
        const Check = (p) => <Icon {...p} path='<polyline points="20 6 9 17 4 12"/>' />;
        const Copy = (p) => <Icon {...p} path='<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>' />;
        const Download = (p) => <Icon {...p} path='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>' />;
        const Sparkles = (p) => <Icon {...p} path='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>' />;
        const Edit3 = (p) => <Icon {...p} path='<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>' />;
        const XCircle = (p) => <Icon {...p} path='<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>' />;
        const Target = (p) => <Icon {...p} path='<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>' />;
        const Lightbulb = (p) => <Icon {...p} path='<line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>' />;

        const actividadesBase = [
            { id: 1, nombre: "Catamarán a Isla Mujeres", ubicacion: "Cancún", demanda: 95, icon: "⛵" },
            { id: 2, nombre: "Río Subterráneo Xcaret", ubicacion: "Riviera Maya", demanda: 91, icon: "🌿" },
            { id: 3, nombre: "Ruinas de Chichén Itzá", ubicacion: "Yucatán", demanda: 88, icon: "🏛️" },
            { id: 4, nombre: "Nado con Tortugas", ubicacion: "Akumal", demanda: 86, icon: "🐢" },
            { id: 5, nombre: "Vida Nocturna Coco Bongo", ubicacion: "Cancún", demanda: 82, icon: "🪩" },
            { id: 6, nombre: "Cenotes Escondidos", ubicacion: "Tulum", demanda: 79, icon: "🤿" },
            { id: 7, nombre: "Snorkel en Arrecifes", ubicacion: "Cozumel", demanda: 77, icon: "🐠" },
            { id: 8, nombre: "Parque Acuático Xel-Há", ubicacion: "Riviera Maya", demanda: 75, icon: "🌊" },
            { id: 9, nombre: "Nado Tiburón Ballena", ubicacion: "Holbox", demanda: 72, icon: "🦈" },
            { id: 10, nombre: "Zona Arqueológica", ubicacion: "Tulum", demanda: 70, icon: "🏺" },
            { id: 11, nombre: "Tour ATV en la Selva", ubicacion: "Playa del Carmen", demanda: 68, icon: "🏍️" },
            { id: 12, nombre: "Laguna 7 Colores", ubicacion: "Bacalar", demanda: 65, icon: "🚣" },
            { id: 13, nombre: "Reserva Natural", ubicacion: "Isla Contoy", demanda: 63, icon: "🏝️" },
            { id: 14, nombre: "Tirolesas Extremas Xplor", ubicacion: "Riviera Maya", demanda: 60, icon: "🧗" },
            { id: 15, nombre: "Museo Subacuático MUSA", ubicacion: "Isla Mujeres", demanda: 58, icon: "🗿" },
            { id: 16, nombre: "Ruinas de Cobá en Bici", ubicacion: "Cobá", demanda: 55, icon: "🚲" },
            { id: 17, nombre: "Buceo Arrecife Palancar", ubicacion: "Cozumel", demanda: 52, icon: "🤿" },
            { id: 18, nombre: "Show Pirata Jolly Roger", ubicacion: "Cancún", demanda: 50, icon: "🏴‍☠️" }
        ];

        const imagenDeRespaldoUniversal = "https://images.unsplash.com/photo-1540206395-68808572332f?auto=format&fit=crop&q=80&w=1200";

        const imagenesRealesHD = {
            1: "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?auto=format&fit=crop&q=80&w=1200", 
            2: "https://images.unsplash.com/photo-1504928148948-43d9c7336a5a?auto=format&fit=crop&q=80&w=1200", 
            3: "https://images.unsplash.com/photo-1518638150341-f706e86654de?auto=format&fit=crop&q=80&w=1200", 
            4: "https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?auto=format&fit=crop&q=80&w=1200", 
            5: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&q=80&w=1200", 
            6: "https://images.unsplash.com/photo-1568402102990-bc541580b59f?auto=format&fit=crop&q=80&w=1200", 
            7: "https://images.unsplash.com/photo-1546026423-cc4642628d2b?auto=format&fit=crop&q=80&w=1200", 
            8: "https://images.unsplash.com/photo-1590523741831-ab7e8b8f9c7f?auto=format&fit=crop&q=80&w=1200", 
            9: "https://images.unsplash.com/photo-1551244072-5d12893278ab?auto=format&fit=crop&q=80&w=1200", 
            10: "https://images.unsplash.com/photo-1510097467424-192d711fd8b6?auto=format&fit=crop&q=80&w=1200", 
            11: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=1200", 
            12: "https://images.unsplash.com/photo-1621252179027-94459d278660?auto=format&fit=crop&q=80&w=1200",
            13: "https://images.unsplash.com/photo-1552074284-5e88ef1aef18?auto=format&fit=crop&q=80&w=1200", // Contoy / Playa virgen
            14: "https://images.unsplash.com/photo-1533560904424-a0c61dc306fc?auto=format&fit=crop&q=80&w=1200", // Tirolesa / Selva
            15: "https://images.unsplash.com/photo-1544552866-d3ed42536fcb?auto=format&fit=crop&q=80&w=1200", // MUSA / Buceo estatuas
            16: "https://images.unsplash.com/photo-1580974928064-f0aeef70895a?auto=format&fit=crop&q=80&w=1200", // Cobá selva
            17: "https://images.unsplash.com/photo-1682695794816-7b9da18ed470?auto=format&fit=crop&q=80&w=1200", // Arrecife Palancar
            18: "https://images.unsplash.com/photo-1596484552834-6a58f850e0a1?auto=format&fit=crop&q=80&w=1200"  // Barco / Show
        };

        const obtenerTextoAleatorio = (actividad, ubicacion, redSocial) => {
            const plantillas = {
                Instagram: [
                    `¡Alerta de Tendencia! 🚨 Todos están reservando: ${actividad}. No te quedes fuera de la experiencia más visual y solicitada de ${ubicacion}. 🌊🌴\n\n✅ Transporte climatizado.\n✅ Guías certificados.\n✅ Fotos increíbles garantizadas.\n\n👉 Cupos limitados. DM para promo exclusiva.`,
                    `Escápate de la rutina hacia el paraíso de ${ubicacion}. 🍃 Nuestra excursión a ${actividad} está diseñada para crear memorias únicas y fotos de envidia. 📸 ¿Con quién te gustaría ir?\n\n👇 Etiquétal@ en los comentarios.\n\nLink en bio para reservar.`,
                    `¿Maletas listas para ${ubicacion}? 📝 Apunta esto en tu itinerario: ${actividad} es un imperdible. ☀️\n\nNosotros nos encargamos de todo para que tú solo disfrutes.\n\n📲 Envíanos DM con la palabra VIAJE para recibir 10% OFF.`
                ],
                Facebook: [
                    `¿Buscando las mejores vacaciones en familia o con amigos? 👨‍👩‍👧‍👦 Descubre por qué ${actividad} en ${ubicacion} es la opción número uno de esta temporada. Ofrecemos paquetes completos con accesos sin filas, atención de primer nivel y total seguridad.\n\n¡Haz clic en el enlace para ver disponibilidad y precios especiales! ✈️`,
                    `¡Planifica tu próximo viaje a ${ubicacion} con la agencia experta! 🌊 Hoy te recomendamos realizar ${actividad}. Es una experiencia completa, relajante y llena de diversión garantizada para todas las edades.\n\nDéjanos un comentario o envíanos un inbox si quieres que te compartamos el itinerario detallado. 👇`
                ],
                TikTok: [
                    `POV: Estás viviendo el mejor día de tu vida en ${ubicacion} 🌴✨\n\n(Idea de Video: Mostrar un mini vlog dinámico de ${actividad} con audio en tendencia).\n\nGuarda este video para tus próximas vacaciones. ¡El link de reserva con descuento está en nuestro perfil! 🏃‍♂️💨 #Cancun #Viajes #Trend`,
                    `3 razones por las que TIENES que hacer ${actividad} si visitas ${ubicacion} 🤯👇\n\n1. Las vistas son irreales 📸\n2. Cero filas reservando con nosotros 🚀\n3. Una experiencia VIP que no olvidarás 🥂\n\nVe al link de nuestro perfil para toda la info.`
                ],
                X: [
                    `Si viajas a ${ubicacion} pronto, tienes que reservar ${actividad}. Literalmente la mejor experiencia de la Riviera. 💯 ¡Aprovecha nuestros cupos de esta semana! Link en bio. 🌊✈️ #Cancun #Travel`,
                    `¿Día de playa o día de aventura? Con ${actividad} en ${ubicacion} lo tienes todo. 🌴🔥 Reserva hoy tu lugar con Amazing Colors y obtén beneficios. RT si mueres por ir. 👇`
                ]
            };

            const opciones = plantillas[redSocial] || plantillas['Instagram'];
            return opciones[Math.floor(Math.random() * opciones.length)];
        };

        const generarEstrategiaCampana = (actividad, ubicacion) => {
            const audiencias = ["Parejas y Lunamieleros 💍", "Familias con niños 👨‍👩‍👧‍👦", "Jóvenes Aventureros 🎒", "Turismo de Lujo ✨"];
            const ganchos = [
                "¿Listo para vivir el mejor día de tu vida?",
                `El secreto mejor guardado de ${ubicacion} revelado.`,
                "No creerás que este lugar existe en México...",
                "Etiqueta a la persona que te debe este viaje."
            ];
            const formatos = [
                "Reel estilo POV (Point of View) con música viral.",
                "Carrusel educativo: 3 razones para visitar.",
                "Video corto con drone y llamado a la acción fuerte.",
                "Foto estática aspiracional con descuento oculto."
            ];

            return {
                audiencia: audiencias[Math.floor(Math.random() * audiencias.length)],
                gancho: ganchos[Math.floor(Math.random() * ganchos.length)],
                formato: formatos[Math.floor(Math.random() * formatos.length)]
            };
        };

        const Toast = ({ mensaje, visible }) => {
            if (!visible) return null;
            return (
                <div className="fixed bottom-6 right-6 bg-slate-900/95 backdrop-blur-md text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-fade-in border border-slate-700">
                    <Check size={20} className="text-emerald-400" />
                    <span className="font-medium text-sm">{mensaje}</span>
                </div>
            );
        };

        function App() {
            const [isSyncing, setIsSyncing] = useState(false);
            const [lastSync, setLastSync] = useState(new Date());
            const [actividades, setActividades] = useState([]);
            const [posts, setPosts] = useState([]);
            
            // Filtros y pestañas
            const [redSocialActiva, setRedSocialActiva] = useState('Instagram');
            const [filtroActividadId, setFiltroActividadId] = useState(null);
            
            // Sistema de Campañas Top 3
            const [campanasTop3, setCampanasTop3] = useState(null); // null = modal cerrado

            // UI
            const [toastMessage, setToastMessage] = useState("");
            const [showToast, setShowToast] = useState(false);

            useEffect(() => {
                actualizarDatos();
            }, []);

            const actualizarDatos = () => {
                setIsSyncing(true);
                
                setTimeout(() => {
                    // Randomizar demanda para simular mercado vivo
                    const actividadesActualizadas = actividadesBase.map(act => ({
                        ...act,
                        demanda: Math.min(100, Math.max(40, act.demanda + (Math.floor(Math.random() * 15) - 7)))
                    })).sort((a, b) => b.demanda - a.demanda);

                    setActividades(actividadesActualizadas);
                    generarYSetearPosts(actividadesActualizadas, redSocialActiva);
                    setLastSync(new Date());
                    
                    mostrarToast("Mercado analizado. Top 18 actividades listas.");
                }, 1200);
            };

            const generarYSetearPosts = (listaActividades, redSocial) => {
                // Generamos posts para las 12 primeras actividades (para no saturar, pero dar muchas opciones)
                const nuevosPosts = listaActividades.slice(0, 12).map((act) => ({
                    id: act.id,
                    actividad: act.nombre,
                    ubicacion: act.ubicacion,
                    imagenUrl: null, 
                    isGeneratingImage: true,
                    copy: obtenerTextoAleatorio(act.nombre, act.ubicacion, redSocial),
                    hashtags: `#${act.ubicacion.replace(/\s+/g, '')} #AmazingColors #CaribeMexicano #Vacaciones #RivieraMaya #TurismoMexico`,
                }));
                
                setPosts(nuevosPosts);
                simularCargaImagenes(nuevosPosts);
            };

            const simularCargaImagenes = async (postsGenerados) => {
                for (let i = 0; i < postsGenerados.length; i++) {
                    const post = postsGenerados[i];
                    const delay = Math.floor(Math.random() * 200) + 100;
                    await new Promise(r => setTimeout(r, delay));

                    setPosts(currentPosts => 
                        currentPosts.map(p => 
                            p.id === post.id 
                            ? { ...p, imagenUrl: imagenesRealesHD[p.id] || imagenDeRespaldoUniversal, isGeneratingImage: false } 
                            : p
                        )
                    );
                }
                setIsSyncing(false);
            };

            const cambiarRedSocial = (nuevaRed) => {
                setRedSocialActiva(nuevaRed);
                setPosts(currentPosts => currentPosts.map(p => ({
                    ...p,
                    copy: obtenerTextoAleatorio(p.actividad, p.ubicacion, nuevaRed)
                })));
                mostrarToast(`Formatos ajustados a ${nuevaRed}`);
            };

            const regenerarCopyUnico = (postId) => {
                setPosts(currentPosts => currentPosts.map(p => {
                    if (p.id === postId) {
                        return { ...p, copy: obtenerTextoAleatorio(p.actividad, p.ubicacion, redSocialActiva) };
                    }
                    return p;
                }));
                mostrarToast("¡Nueva idea generada!");
            };

            const toggleFiltro = (id) => {
                setFiltroActividadId(prevId => prevId === id ? null : id);
                if (id) {
                    mostrarToast("Mostrando contenido específico de la actividad.");
                }
            };

            const mostrarToast = (mensaje) => {
                setToastMessage(mensaje);
                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);
            };

            const copiarAlPortapapeles = (texto) => {
                const textarea = document.createElement('textarea');
                textarea.value = texto;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    mostrarToast("¡Texto copiado!");
                } catch (err) {
                    console.error('Error', err);
                }
                document.body.removeChild(textarea);
            };

            const descargarImagen = async (url, nombreActividad) => {
                if (!url) return;
                mostrarToast("Iniciando descarga HD...");
                try {
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const blobUrl = window.URL.createObjectURL(blob);
                    const enlace = document.createElement('a');
                    enlace.href = blobUrl;
                    enlace.download = `Amazing_${nombreActividad.replace(/\s+/g, '_')}_HD.jpg`;
                    document.body.appendChild(enlace);
                    enlace.click();
                    document.body.removeChild(enlace);
                    window.URL.revokeObjectURL(blobUrl);
                } catch (error) {
                    const enlace = document.createElement('a');
                    enlace.href = url;
                    enlace.target = "_blank";
                    enlace.download = `Amazing_${nombreActividad.replace(/\s+/g, '_')}_HD.jpg`;
                    document.body.appendChild(enlace);
                    enlace.click();
                    document.body.removeChild(enlace);
                }
            };

            const generarIdeasTop3 = () => {
                const top3 = actividades.slice(0, 3);
                const ideas = top3.map(act => ({
                    ...act,
                    estrategia: generarEstrategiaCampana(act.nombre, act.ubicacion)
                }));
                setCampanasTop3(ideas);
                mostrarToast("¡Estrategias generadas con éxito!");
            };

            const formatearFecha = (fecha) => fecha.toLocaleTimeString('es-MX', { hour: '2-digit', minute:'2-digit' });

            const postsAMostrar = filtroActividadId 
                ? posts.filter(p => p.id === filtroActividadId) 
                : posts;

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    
                    {/* ENCABEZADO */}
                    <header className="bg-gradient-to-r from-slate-950 via-teal-950 to-slate-950 text-white p-6 shadow-xl border-b border-teal-500/20">
                        <div className="max-w-[1400px] mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-4">
                                <div className="bg-white rounded-2xl border border-white/10 flex items-center justify-center w-16 h-16 shadow-md overflow-hidden p-1.5">
                                    <img 
                                        src="Png_Logo%20Vertical%20Texto%20Negro.png" 
                                        alt="Amazing Colors Logo" 
                                        className="w-full h-full object-contain" 
                                        onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1540206395-68808572332f?auto=format&fit=crop&q=80&w=150'; }}
                                    />
                                </div>
                                <div>
                                    <h1 className="text-3xl font-black tracking-tight text-white">
                                        Agente Turístico <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-300 to-emerald-300">Amazing</span>
                                    </h1>
                                    <p className="text-teal-200/70 text-sm font-medium flex items-center gap-2 mt-1">
                                        <MapPin size={14} className="text-teal-400" />
                                        Módulo de Marketing e IA
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-4 bg-white/5 p-2 rounded-2xl backdrop-blur-md border border-white/10">
                                <div className="hidden sm:flex items-center gap-2 text-sm text-teal-100/90 px-3 font-medium">
                                    <Clock size={16} className="text-teal-400" />
                                    <span>Último escaneo: <strong className="text-white">{formatearFecha(lastSync)}</strong></span>
                                </div>
                                <button 
                                    onClick={actualizarDatos}
                                    disabled={isSyncing}
                                    className={`flex items-center gap-2 px-6 py-2.5 rounded-xl font-bold text-sm transition-all duration-300 ${
                                        isSyncing ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-teal-500 hover:bg-teal-400 text-white shadow-lg shadow-teal-500/20 hover:scale-105'
                                    }`}
                                >
                                    <RefreshCw size={18} className={isSyncing ? 'animate-spin' : ''} />
                                    {isSyncing ? 'Escaneando...' : 'Escanear Mercado'}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main className="max-w-[1400px] mx-auto p-4 sm:p-6 lg:p-8 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* COLUMNA IZQUIERDA: RADAR DE TENDENCIAS */}
                        <section className="lg:col-span-4 lg:col-start-1 flex flex-col gap-6">
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 flex flex-col h-[calc(100vh-140px)] sticky top-6">
                                
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-xl font-black flex items-center gap-2 text-slate-900">
                                        <TrendingUp size={24} className="text-teal-500" />
                                        Radar de Demanda
                                    </h2>
                                </div>
                                
                                {filtroActividadId && (
                                    <button 
                                        onClick={() => setFiltroActividadId(null)}
                                        className="w-full mb-4 flex items-center justify-center gap-2 text-xs font-bold text-slate-500 bg-slate-100 py-2 rounded-xl hover:bg-slate-200 transition-colors"
                                    >
                                        <XCircle size={14} /> Quitar filtro de actividad
                                    </button>
                                )}

                                <div className="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar mb-4">
                                    {actividades.map((actividad, index) => {
                                        const isActivo = filtroActividadId === actividad.id;
                                        return (
                                            <div 
                                                key={actividad.id} 
                                                onClick={() => toggleFiltro(actividad.id)}
                                                className={`group p-3 rounded-2xl border transition-all cursor-pointer ${isActivo ? 'bg-teal-50 border-teal-300 shadow-md ring-2 ring-teal-500/20' : 'border-slate-100 hover:bg-slate-50 hover:border-slate-300'}`}
                                            >
                                                <div className="flex justify-between items-center mb-2">
                                                    <div className="flex items-center gap-3">
                                                        <div className={`text-xl w-10 h-10 flex items-center justify-center rounded-xl shadow-sm transition-transform ${isActivo ? 'bg-white border-teal-200 scale-110' : 'bg-slate-50 border-slate-100 group-hover:scale-105'}`}>
                                                            {actividad.icon}
                                                        </div>
                                                        <div>
                                                            <h3 className={`font-extrabold text-sm leading-tight transition-colors ${isActivo ? 'text-teal-700' : 'text-slate-800 group-hover:text-teal-600'}`}>
                                                                {actividad.nombre}
                                                            </h3>
                                                            <div className="text-[11px] text-slate-400 mt-0.5 font-semibold flex items-center gap-1">
                                                                <MapPin size={10} /> {actividad.ubicacion}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="text-right pl-2">
                                                        <span className="text-sm font-black text-teal-600">{actividad.demanda}</span>
                                                    </div>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                                                    <div 
                                                        className={`h-full rounded-full transition-all duration-1000 ease-out relative ${
                                                            index === 0 ? 'bg-red-500' : index === 1 ? 'bg-orange-500' : index === 2 ? 'bg-amber-400' : 'bg-teal-400'
                                                        }`}
                                                        style={{ width: `${actividad.demanda}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* BOTÓN DE ESTRATEGIA (NUEVO) */}
                                <div className="pt-4 border-t border-slate-100 mt-auto">
                                    <button 
                                        onClick={generarIdeasTop3}
                                        className="w-full flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-2xl font-bold transition-all shadow-lg shadow-slate-900/20 hover:-translate-y-1"
                                    >
                                        <Target size={18} className="text-emerald-400" />
                                        Generar Campañas Top 3
                                    </button>
                                </div>
                            </div>
                        </section>

                        {/* COLUMNA DERECHA: GENERADOR DE CONTENIDO */}
                        <section className="lg:col-span-8 flex flex-col gap-6">
                            
                            {/* Selector de Redes Sociales */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-2 flex flex-wrap gap-2 w-full lg:w-max">
                                {[
                                    { nombre: 'Instagram', icono: <Instagram size={18}/>, color: 'hover:text-pink-600' },
                                    { nombre: 'Facebook', icono: <Facebook size={18}/>, color: 'hover:text-blue-600' },
                                    { nombre: 'TikTok', icono: <TikTok size={18}/>, color: 'hover:text-slate-900' },
                                    { nombre: 'X', icono: <Twitter size={18}/>, color: 'hover:text-blue-400' }
                                ].map(red => (
                                    <button
                                        key={red.nombre}
                                        onClick={() => cambiarRedSocial(red.nombre)}
                                        className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${
                                            redSocialActiva === red.nombre 
                                            ? 'bg-teal-500 text-white shadow-md' 
                                            : `text-slate-600 hover:bg-slate-100 ${red.color}`
                                        }`}
                                    >
                                        {red.icono} {red.nombre}
                                    </button>
                                ))}
                            </div>

                            {/* Muro de Publicaciones */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-12">
                                {postsAMostrar.map((post) => (
                                    <div key={post.id} className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full hover:shadow-xl transition-shadow duration-300">
                                        
                                        {/* Header Post */}
                                        <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-white p-1 shadow-sm border border-slate-200 flex items-center justify-center">
                                                    <img 
                                                        src="Png_Logo%20Vertical%20Texto%20Negro.png" 
                                                        alt="Amazing Colors" 
                                                        className="w-full h-full object-contain"
                                                        onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1540206395-68808572332f?auto=format&fit=crop&q=80&w=150'; }}
                                                    />
                                                </div>
                                                <div>
                                                    <div className="text-xs font-black text-slate-800">Amazing Colors</div>
                                                    <div className="text-[10px] text-slate-500 font-semibold">{redSocialActiva} • {post.ubicacion}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Imagen */}
                                        <div className="relative aspect-square bg-slate-100 flex items-center justify-center overflow-hidden border-b border-slate-100 group">
                                            {post.isGeneratingImage ? (
                                                <RefreshCw size={32} className="animate-spin text-teal-400" />
                                            ) : (
                                                <img 
                                                    src={post.imagenUrl} 
                                                    alt={post.actividad} 
                                                    className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                                                    onError={(e) => { e.target.src = imagenDeRespaldoUniversal; }}
                                                />
                                            )}
                                            
                                            <div className="absolute top-3 right-3 bg-black/50 backdrop-blur-sm text-white p-1.5 rounded-full cursor-pointer hover:bg-black/70 transition-colors" title="Cambiar texto" onClick={() => regenerarCopyUnico(post.id)}>
                                                <Edit3 size={16} />
                                            </div>
                                        </div>

                                        {/* Body */}
                                        <div className="p-5 flex-1 flex flex-col bg-white">
                                            <h3 className="text-lg font-black text-slate-900 mb-2">{post.actividad}</h3>
                                            <div className="text-xs text-slate-700 whitespace-pre-wrap flex-1 mb-4 leading-relaxed">
                                                {post.copy}
                                            </div>
                                            <div className="text-[11px] text-teal-600 font-bold mb-4">{post.hashtags}</div>
                                            
                                            {/* Actions */}
                                            <div className="mt-auto flex gap-2 pt-4 border-t border-slate-100">
                                                <button onClick={() => copiarAlPortapapeles(`${post.copy}\n\n${post.hashtags}`)} className="flex-1 flex items-center justify-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 py-2.5 rounded-xl text-xs font-bold transition-colors">
                                                    <Copy size={14} /> Copiar
                                                </button>
                                                <button onClick={() => descargarImagen(post.imagenUrl, post.actividad)} disabled={post.isGeneratingImage} className="flex-1 flex items-center justify-center gap-1.5 bg-teal-600 hover:bg-teal-700 text-white py-2.5 rounded-xl text-xs font-bold transition-colors shadow-md">
                                                    <Download size={14} /> Foto HD
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {postsAMostrar.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500 font-medium">
                                        No se encontraron publicaciones. Actualiza el agente o quita los filtros.
                                    </div>
                                )}
                            </div>
                        </section>
                    </main>

                    {/* MODAL CAMPANAS TOP 3 (NUEVO) */}
                    {campanasTop3 && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
                                
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-900 flex items-center gap-3">
                                            <Target size={28} className="text-emerald-500" />
                                            Estrategia de Campañas: Top 3 Demanda
                                        </h2>
                                        <p className="text-sm text-slate-500 mt-1 font-medium">Sugerencias estratégicas generadas por IA para capitalizar el interés actual.</p>
                                    </div>
                                    <button onClick={() => setCampanasTop3(null)} className="text-slate-400 hover:text-red-500 transition-colors p-2 bg-white rounded-full shadow-sm border border-slate-200">
                                        <XCircle size={24} />
                                    </button>
                                </div>

                                <div className="p-6 overflow-y-auto bg-slate-50/50 flex-1">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {campanasTop3.map((campana, i) => (
                                            <div key={i} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm relative overflow-hidden">
                                                <div className="absolute top-0 right-0 bg-slate-900 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl z-10">
                                                    PRIORIDAD #{i + 1}
                                                </div>
                                                <div className="flex items-center gap-3 mb-4">
                                                    <div className="text-3xl">{campana.icon}</div>
                                                    <div>
                                                        <h3 className="font-black text-sm text-slate-900 leading-tight">{campana.nombre}</h3>
                                                        <span className="text-[11px] text-slate-500 font-semibold">{campana.ubicacion}</span>
                                                    </div>
                                                </div>
                                                
                                                <div className="space-y-4">
                                                    <div className="bg-blue-50/50 p-3 rounded-xl border border-blue-100">
                                                        <div className="text-[10px] font-bold text-blue-600 uppercase mb-1">Público Objetivo</div>
                                                        <div className="text-xs font-medium text-slate-800">{campana.estrategia.audiencia}</div>
                                                    </div>
                                                    <div className="bg-amber-50/50 p-3 rounded-xl border border-amber-100">
                                                        <div className="text-[10px] font-bold text-amber-600 uppercase mb-1">Mejor Gancho (Hook)</div>
                                                        <div className="text-xs font-black text-slate-800 italic">"{campana.estrategia.gancho}"</div>
                                                    </div>
                                                    <div className="bg-purple-50/50 p-3 rounded-xl border border-purple-100">
                                                        <div className="text-[10px] font-bold text-purple-600 uppercase mb-1 flex items-center gap-1"><Lightbulb size={12}/> Formato Sugerido</div>
                                                        <div className="text-xs font-medium text-slate-800">{campana.estrategia.formato}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="p-4 border-t border-slate-100 bg-white flex justify-end">
                                    <button onClick={() => setCampanasTop3(null)} className="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-sm font-bold hover:bg-slate-800 transition-colors">
                                        Cerrar Panel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <Toast mensaje={toastMessage} visible={showToast} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
